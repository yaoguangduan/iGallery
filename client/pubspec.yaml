publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  http: ^1.6.0
  bonsoir: ^7.1.5
  file_picker: ^12.1.3
  video_player: ^2.9.0
  photo_view: ^0.15.0
  path_provider: ^2.1.6
